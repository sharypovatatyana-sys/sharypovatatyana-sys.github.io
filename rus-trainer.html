       <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Словарные слова</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('background1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        /* ============================================================ */
        /* ОСНОВНАЯ ОБЁРТКА */
        /* ============================================================ */
        .wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 693px;
            width: 100%;
            max-height: 100vh;
            height: 100%;
            justify-content: flex-start;
            padding-top: 4vh;
            padding-bottom: 5px;
        }

        /* ============================================================ */
        /* КНОПКА "В МЕНЮ" - В ВЕРХНЕМ ЛЕВОМ УГЛУ ЭКРАНА */
        /* ============================================================ */
        .btn-menu-home {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 48px;
            height: 48px;
            background: #FFFFFF;
            border: 3px solid #1978C3;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .btn-menu-home:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 16px rgba(0, 0, 0, 0.35);
        }

        .btn-menu-home:active {
            transform: scale(0.92);
        }

        .btn-menu-home svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: #1978C3;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-menu-home.visible {
            display: flex;
        }

        /* ============================================================ */
        /* ЗАГОЛОВОК - С ОТСТУПОМ ДЛЯ КНОПКИ-ДОМИКА */
        /* ============================================================ */
        .main-title {
            font-family: 'Fredoka One', 'Nunito', sans-serif;
            font-size: 56px;
            font-weight: 900;
            color: #F95F29;
            text-align: center;
            letter-spacing: 2px;
            line-height: 1.1;
            text-shadow: 
                -4px -4px 0 #FFFFFF,
                4px -4px 0 #FFFFFF,
                -4px 4px 0 #FFFFFF,
                4px 4px 0 #FFFFFF,
                0px 8px 16px #DCB160;
            flex-shrink: 0;
            padding: 8px 0 4px 0;
            width: 100%;
            padding-left: 60px; /* ← отступ для кнопки-домика */
            padding-right: 10px;
        }

        /* ============================================================ */
        /* БЕЛЫЙ КОНТЕЙНЕР */
        /* ============================================================ */
        .container {
            position: relative;
            width: 100%;
            max-width: 693px;
            min-height: 500px;
            background: #FFFFFF;
            box-shadow: 0px 4px 10.2px #FDDA8B;
            border-radius: 41px;
            padding: 28px 35px 25px 35px;
            margin: 0 auto;
            margin-top: 15px;    
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* ============================================================ */
        /* ГЛАВНЫЙ ЭКРАН */
        /* ============================================================ */
        .screen-main {
            display: block;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .screen-main.hidden {
            display: none;
        }

        .main-subtitle {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .class-selection {
            margin-bottom: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
        }

        .class-selection .label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
            display: block;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex: 1;
            align-content: stretch;
            height: 100%;
            min-height: 0;
        }

        .class-btn {
            position: relative;
            padding: 8px 4px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #fff;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            text-align: center;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
            transform: translateY(0);
            background: #f0f0f0;
            color: #555;
            width: 100%;
            height: 100%;
            min-height: 50px;
            aspect-ratio: 1 / 0.85;
        }

        .class-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
        }

        .class-btn:not(.active) {
            background: #f0f0f0;
            color: #555;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);
        }

        .class-btn:not(.active) .class-number {
            color: #555;
        }

        .class-btn:not(.active) .class-label {
            color: #999;
        }

        /* Активные кнопки по классам */
        .class-btn.active[data-class="1"] { background: linear-gradient(145deg, #FFD42A, #f5c800); box-shadow: 0 3px 0 #c9a100; color: #fff; }
        .class-btn.active[data-class="2"] { background: linear-gradient(145deg, #A0CC3A, #8cb82e); box-shadow: 0 3px 0 #6f9424; color: #fff; }
        .class-btn.active[data-class="3"] { background: linear-gradient(145deg, #529CE5, #3a88d1); box-shadow: 0 3px 0 #2a6ea8; color: #fff; }
        .class-btn.active[data-class="4"] { background: linear-gradient(145deg, #B371E4, #a05cd6); box-shadow: 0 3px 0 #7f44b0; color: #fff; }
        .class-btn.active[data-class="5"] { background: linear-gradient(145deg, #F39B2B, #e0891a); box-shadow: 0 3px 0 #b86e14; color: #fff; }
        .class-btn.active[data-class="6"] { background: linear-gradient(145deg, #29C3C2, #1eabaa); box-shadow: 0 3px 0 #178887; color: #fff; }
        .class-btn.active[data-class="7"] { background: linear-gradient(145deg, #AF5FD1, #9c4abf); box-shadow: 0 3px 0 #7d3999; color: #fff; }
        .class-btn.active[data-class="8"] { background: linear-gradient(145deg, #FA5D4B, #e84a38); box-shadow: 0 3px 0 #c03a2a; color: #fff; }
        .class-btn.active[data-class="9"] { background: linear-gradient(145deg, #28B3CE, #1e9db5); box-shadow: 0 3px 0 #177d91; color: #fff; }
        .class-btn.active[data-class="10"] { background: linear-gradient(145deg, #A9CD2E, #95b827); box-shadow: 0 3px 0 #77941e; color: #fff; }
        .class-btn.active[data-class="11"] { background: linear-gradient(145deg, #FF6295, #f04a80); box-shadow: 0 3px 0 #c93a66; color: #fff; }

        .class-btn.active .class-number { color: #fff; font-size: clamp(18px, 3vw, 32px); }
        .class-btn.active .class-label { color: rgba(255, 255, 255, 0.85); font-size: clamp(9px, 1.2vw, 13px); }

        .class-btn .class-number {
            font-size: clamp(18px, 3vw, 32px);
            font-weight: 800;
            font-family: 'Fredoka One', 'Nunito', sans-serif;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .class-btn .class-label {
            font-size: clamp(9px, 1.2vw, 13px);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .class-btn:hover:not(.active) {
            transform: translateY(-2px);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
        }

        .class-btn.active:hover {
            transform: translateY(-2px);
        }

        .class-btn.active:hover[data-class="1"] { box-shadow: 0 4px 0 #c9a100; }
        .class-btn.active:hover[data-class="2"] { box-shadow: 0 4px 0 #6f9424; }
        .class-btn.active:hover[data-class="3"] { box-shadow: 0 4px 0 #2a6ea8; }
        .class-btn.active:hover[data-class="4"] { box-shadow: 0 4px 0 #7f44b0; }
        .class-btn.active:hover[data-class="5"] { box-shadow: 0 4px 0 #b86e14; }
        .class-btn.active:hover[data-class="6"] { box-shadow: 0 4px 0 #178887; }
        .class-btn.active:hover[data-class="7"] { box-shadow: 0 4px 0 #7d3999; }
        .class-btn.active:hover[data-class="8"] { box-shadow: 0 4px 0 #c03a2a; }
        .class-btn.active:hover[data-class="9"] { box-shadow: 0 4px 0 #177d91; }
        .class-btn.active:hover[data-class="10"] { box-shadow: 0 4px 0 #77941e; }
        .class-btn.active:hover[data-class="11"] { box-shadow: 0 4px 0 #c93a66; }

        .class-btn:active {
            transform: translateY(3px) !important;
        }

        .class-btn.active:active {
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2) !important;
        }

        .selection-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
            font-style: italic;
            flex-shrink: 0;
        }

        .btn {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ========== ЭКРАН ИГРЫ ========== */
        .screen-game {
            display: none;
            width: 100%;
            flex: 1;
            display: none;
            flex-direction: column;
        }
        .screen-game.active {
            display: flex;
        }

        .game-progress {
            font-size: 16px;
            font-weight: 700;
            color: #555;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            width: 100%;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .game-progress span {
            color: #667eea;
        }

        .game-instruction {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 16px;
            font-family: 'Nunito', sans-serif;
            flex-shrink: 0;
        }

        .word-status-block {
            text-align: center;
            padding: 10px 0 16px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .word-status-icon {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1978C3;
            border: 3px solid #FFFFFF;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .word-status-icon svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .word-status-icon.finished {
            display: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.25); }
            50% { transform: scale(1.08); box-shadow: 0px 6px 15px rgba(25, 120, 195, 0.5); }
        }

        .word-status-text {
            font-size: 16px;
            color: #888;
            font-weight: 600;
            margin-top: 6px;
            font-family: 'Nunito', sans-serif;
        }
        .word-status-text.active {
            color: #667eea;
            font-weight: 700;
        }

        .input-row {
            margin-bottom: 14px;
            width: 100%;
            flex-shrink: 0;
        }
        .input-row input {
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 10px 18px;
            gap: 8px;
            width: 100%;
            height: 44px;
            background: #FFFFFF;
            border: 2px solid #ADBFDB;
            box-shadow: 0px 3px 5px rgba(104, 109, 208, 0.15);
            border-radius: 12px;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            font-size: 16px;
            color: #333;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-weight: 600;
        }
        .input-row input:focus {
            border-color: #667eea;
            box-shadow: 0px 3px 8px rgba(104, 109, 208, 0.3);
        }
        .input-row input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .input-row input::placeholder {
            color: #999;
            font-weight: 400;
        }

        .game-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            width: 100%;
            justify-content: center;
            flex-shrink: 0;
        }
        .game-buttons .btn {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            height: 48px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Nunito', sans-serif;
        }

        .btn-check {
            background: linear-gradient(176.28deg, #76C64A 2.85%, #48AE0A 96.77%);
            box-shadow: 0px 3px 5px #478E3B;
            color: #FFFFFF;
            flex: 1;
        }
        .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0px 4px 8px #478E3B;
            background: linear-gradient(176.28deg, #80d454 2.85%, #4fb80e 96.77%);
        }
        .btn-check:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-check:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-repeat {
            background: linear-gradient(176.28deg, #FDB52D 5.89%, #FD9D0A 97.73%);
            box-shadow: 0px 3px 5px #D97805;
            color: #FFFFFF;
            flex: 1;
        }
        .btn-repeat:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0px 4px 8px #D97805;
            background: linear-gradient(176.28deg, #fec04a 5.89%, #fdaa1a 97.73%);
        }
        .btn-repeat:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-repeat:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-repeat svg,
        .btn-check svg {
            width: 18px;
            height: 18px;
            flex: none;
        }

        .btn-finish-round {
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            gap: 8px;
            width: 100%;
            height: 54px;
            background: linear-gradient(180deg, #FDB52D 0%, #FD9D0A 100%);
            border: 3px solid #FFFFFF;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.2);
            border-radius: 50px;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            font-size: 17px;
            font-weight: 800;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            line-height: 1;
            letter-spacing: 0.5px;
            margin-top: auto;
            flex-shrink: 0;
        }
        .btn-finish-round:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
            background: linear-gradient(180deg, #fec44a 0%, #fdaa1a 100%);
        }
        .btn-finish-round:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-finish-round:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .stats {
            text-align: center;
            font-size: 14px;
            color: #555;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 10px;
            min-height: 34px;
            width: 100%;
            font-weight: 600;
            font-family: 'Nunito', sans-serif;
            flex-shrink: 0;
        }
        .stats span {
            font-weight: 700;
            color: #667eea;
        }

        .message {
            text-align: center;
            padding: 10px 14px;
            margin-top: 8px;
            border-radius: 10px;
            font-weight: 700;
            display: none;
            animation: slideIn 0.3s ease;
            font-size: 14px;
            width: 100%;
            font-family: 'Nunito', sans-serif;
            flex-shrink: 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #a5d6a7;
        }
        .message.error {
            display: block;
            background: #fce4ec;
            color: #c62828;
            border: 2px solid #ef9a9a;
        }

        .message .correct-answer {
            display: block;
            margin-top: 4px;
            font-size: 17px;
            color: #2e7d32;
            background: #c8e6c9;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 700;
        }
        .message .wrong-answer {
            display: block;
            margin-top: 4px;
            font-size: 15px;
        }
        .message .wrong-answer span {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .message .wrong-answer .arrow {
            margin: 0 6px;
            font-size: 18px;
        }

        /* ========== ЭКРАН РЕЗУЛЬТАТОВ ========== */
        .screen-result {
            display: none;
            width: 100%;
            flex-direction: column;
            flex: 1;
        }
        .screen-result.active {
            display: flex;
        }

        .result-title {
            text-align: center;
            font-family: 'Fredoka One', 'Nunito', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #333;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .result-stats {
            text-align: center;
            font-size: 16px;
            color: #555;
            margin-bottom: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            font-weight: 600;
        }
        .result-stats span {
            color: #667eea;
            font-weight: 800;
        }
        .result-stats .grade {
            display: block;
            margin-top: 6px;
            font-size: 20px;
            color: #333;
        }

        .result-errors {
            margin-bottom: 15px;
            flex: 1;
        }
        .result-errors .errors-title {
            font-size: 14px;
            font-weight: 700;
            color: #555;
            margin-bottom: 8px;
        }
        .result-errors .errors-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-left: 15px;
        }
        .result-errors .error-word {
            font-size: 14px;
            font-weight: 600;
            color: #c62828;
            list-style: none;
        }
        .result-errors .no-errors {
            text-align: center;
            font-size: 15px;
            color: #4CAF50;
            font-weight: 700;
            padding: 8px;
        }
        .result-errors.hidden-errors {
            display: none;
        }

        .result-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-result-retry {
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 10px 24px;
            gap: 4px;
            height: 44px;
            background: #FA5D4B;
            border: 3px solid #FFFFFF;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.25);
            border-radius: 50px;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            line-height: 1;
            flex-shrink: 0;
            width: 100%;
            justify-content: center;
        }
        .btn-result-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            background: #e84a38;
        }
        .btn-result-retry:active {
            transform: scale(0.97);
        }

        /* ============================================================ */
        /* КНОПКА "НАЧАТЬ ТРЕНИРОВКУ" */
        /* ============================================================ */
        .btn-play {
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 8px 15px;
            gap: 5px;
            width: 100%;
            max-width: 490px;
            height: 56px;
            margin-top: 12px;
            background: linear-gradient(180deg, #88B913 0%, #4BA411 100%);
            border: 5px solid #FFFFFF;
            box-shadow: 0px 7px 13px #DCB160;
            border-radius: 50px;
            font-family: 'Nunito', 'Segoe UI', sans-serif;

    // =============================================================
    // СИНТЕЗ РЕЧИ
    // =============================================================
    function initSpeech() {
        if ('speechSynthesis' in window) {
            speechSynth = window.speechSynthesis;
            return true;
        }
        return false;
    }

    function speakWord(word, callback) {
        if (!speechSynth) {
            if (callback) callback();
            return;
        }

        let phoneticWord = word;
        if (stressMap[word]) {
            phoneticWord = stressMap[word];
            console.log(`🔊 Произношу: ${word} → ${phoneticWord}`);
        }

        speechSynth.cancel();

        const utterance = new SpeechSynthesisUtterance(phoneticWord);
        utterance.lang = 'ru-RU';
        utterance.rate = 0.7;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        const voices = speechSynth.getVoices();
        const ruVoice = voices.find(voice => voice.lang.startsWith('ru'));
        if (ruVoice) utterance.voice = ruVoice;

        isSpeaking = true;
        
        const speakerIcon = statusIcon.querySelector('.speaker-icon');
        const pencilIcon = statusIcon.querySelector('.pencil-icon');
        if (speakerIcon) speakerIcon.style.display = 'block';
        if (pencilIcon) pencilIcon.style.display = 'none';
        
        statusIcon.style.animation = 'pulse 0.8s ease-in-out infinite';
        statusText.textContent = 'Слово произносится...';
        statusText.className = 'word-status-text active';

        utterance.onstart = () => {
            isSpeaking = true;
        };

        utterance.onend = () => {
            isSpeaking = false;
            
            if (speakerIcon) speakerIcon.style.display = 'none';
            if (pencilIcon) pencilIcon.style.display = 'block';
            
            statusIcon.style.animation = 'pulse 1.5s ease-in-out infinite';
            statusText.textContent = 'Введи слово...';
            statusText.className = 'word-status-text';
            wordInput.disabled = false;
            checkBtn.disabled = false;
            wordInput.focus();
            if (callback) callback();
        };

        utterance.onerror = () => {
            isSpeaking = false;
            statusIcon.style.animation = 'none';
            statusText.textContent = 'Ошибка озвучки';
            statusText.className = 'word-status-text';
            wordInput.disabled = false;
            checkBtn.disabled = false;
            if (callback) callback();
        };

        speechSynth.speak(utterance);

        wordInput.disabled = true;
        checkBtn.disabled = true;
        repeatBtn.disabled = false;

        setTimeout(() => {
            if (isSpeaking) {
                isSpeaking = false;
                if (speakerIcon) speakerIcon.style.display = 'none';
                if (pencilIcon) pencilIcon.style.display = 'block';
                statusIcon.style.animation = 'pulse 1.5s ease-in-out infinite';
                statusText.textContent = 'Введи слово...';
                statusText.className = 'word-status-text';
                wordInput.disabled = false;
                checkBtn.disabled = false;
            }
        }, 5000);
    }

    function showResults() {
        isFinished = true;
        isGameActive = false;
        
        if (speechSynth) speechSynth.cancel();
        
        wordInput.disabled = true;
        checkBtn.disabled = true;
        repeatBtn.disabled = true;
        finishBtn.disabled = true;
        
        gameScreen.classList.remove('active');
        resultScreen.classList.add('active');
        menuBtnFromGame.classList.add('visible');
        
        const totalWords = total;
        const correctAnswers = correct;
        const percent = totalWords > 0 ? Math.round((correctAnswers / totalWords) * 100) : 0;
        
        let grade = '';
        if (percent === 100) { grade = 'Отлично!'; }
        else if (percent >= 80) { grade = 'Хорошо!'; }
        else if (percent >= 60) { grade = 'Неплохо!'; }
        else if (percent >= 40) { grade = 'Повтори ещё!'; }
        else { grade = 'Тренируйся больше!'; }
        
        resultStats.innerHTML = `
            Правильно: <span>${correctAnswers}</span> из <span>${totalWords}</span><br>
            <span class="grade">${grade} (${percent}%)</span>
        `;
        
        if (errorWords.length === 0) {
            resultErrors.classList.add('hidden-errors');
            errorsList.innerHTML = '';
        } else {
            resultErrors.classList.remove('hidden-errors');
            errorsList.innerHTML = errorWords.map(word => 
                `<div class="error-word">${word}</div>`
            ).join('');
        }
    }

    function startGame() {
        const selectedClassesList = Array.from(selectedClasses);
        
        if (selectedClassesList.length === 0) {
            showMessage('Выберите хотя бы один класс!', 'error');
            return;
        }

        selectedWords = [];
        selectedClassesList.forEach(cls => {
            if (wordsByClass[cls]) {
                selectedWords = selectedWords.concat(wordsByClass[cls]);
            }
        });

        selectedWords = [...new Set(selectedWords.filter(word => word && word.trim() !== ''))];

        if (selectedWords.length === 0) {
            showMessage('Нет слов для выбранных классов', 'error');
            return;
        }

        selectedWords = shuffleArray(selectedWords);

        total = 0;
        correct = 0;
        wordIndex = 0;
        isFinished = false;
        errorWords = [];
        
        statusIcon.classList.remove('finished');
        statusText.className = 'word-status-text';

        document.getElementById('totalCount').textContent = '0';
        
        totalNum.textContent = selectedWords.length;

        gameScreen.classList.add('active');
        resultScreen.classList.remove('active');
        hideMessage();

        isWaitingForNext = false;
        finishBtn.disabled = false;

        playBtn.style.display = 'none';
        menuBtnFromGame.classList.add('visible');

        nextWord();

        if (selectedWords.length === 0 || wordIndex >= selectedWords.length) {
            showResults();
            playBtn.style.display = 'flex';
            return;
        }

        currentWord = selectedWords[wordIndex];
        wordIndex++;

        currentNum.textContent = wordIndex;

        hideMessage();

        const speakerIcon = statusIcon.querySelector('.speaker-icon');
        const pencilIcon = statusIcon.querySelector('.pencil-icon');
        if (speakerIcon) speakerIcon.style.display = 'block';
        if (pencilIcon) pencilIcon.style.display = 'none';
        
        statusIcon.style.animation = 'pulse 0.8s ease-in-out infinite';
        statusText.textContent = 'Слово произносится...';
        statusText.className = 'word-status-text active';

        speakWord(currentWord);

        wordInput.value = '';
        wordInput.disabled = true;
        checkBtn.disabled = true;
        repeatBtn.disabled = false;

        isWaitingForNext = false;
    }

    // =============================================================
    // ПРОВЕРИТЬ
    // =============================================================
    function checkWord() {
        if (!isGameActive || !currentWord || isWaitingForNext || isFinished) return;

        const userInput = wordInput.value.trim().toLowerCase();
        if (!userInput) {
            showMessage('Введите слово!', 'error');
            return;
        }

        total++;

        if (userInput === currentWord) {
            correct++;
            showMessage('Правильно! Молодец!', 'success');
        } else {
            errorWords.push(currentWord);
            showErrorWithCorrectAnswer(userInput, currentWord);
        }

        document.getElementById('correctCount').textContent = correct;
        document.getElementById('totalCount').textContent = total;

        wordInput.disabled = true;
        checkBtn.disabled = true;
        repeatBtn.disabled = true;
        isWaitingForNext = true;

        setTimeout(() => {
            if (!isFinished) {
                nextWord();
            }
        }, 3000);
    }

    // =============================================================
    // ОШИБКА
    // =============================================================
    function showErrorWithCorrectAnswer(wrongWord, correctWord) {
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
        messageDiv.innerHTML = `
            Неправильно!
            <div class="wrong-answer">
                Вы написали: <span>${wrongWord}</span>
                <span class="arrow">→</span>
                Правильно: ${correctWord}
            </div>
            <div class="correct-answer">
                Запомните: <strong>${correctWord}</strong>
            </div>
        `;
    }

    // =============================================================
    // СООБЩЕНИЯ
    // =============================================================
    function showMessage(text, type) {
        messageDiv.className = 'message ' + type;
        messageDiv.style.display = 'block';
        messageDiv.innerHTML = text;
    }

    function hideMessage() {
        messageDiv.style.display = 'none';
        messageDiv.className = 'message';
        messageDiv.innerHTML = '';
    }

    // =============================================================
    // ВСПОМОГАТЕЛЬНЫЕ
    // =============================================================
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // =============================================================
    // СОБЫТИЯ
    // =============================================================
    playBtn.addEventListener('click', startGame);
    menuBtnFromGame.addEventListener('click', function() {
        showMainScreen();
        playBtn.style.display = 'flex';
    });
    resultRetryBtn.addEventListener('click', function() {
        startGame();
    });
    finishBtn.addEventListener('click', finishDictation);
    checkBtn.addEventListener('click', checkWord);
    repeatBtn.addEventListener('click', repeatWord);

    wordInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !this.disabled && !isWaitingForNext && !isFinished) {
            checkWord();
        }
    });

    // =============================================================
    // ИНИЦИАЛИЗАЦИЯ
    // =============================================================
    document.addEventListener('DOMContentLoaded', function() {
        initSpeech();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
        playBtn.style.display = 'flex';
        menuBtnFromGame.classList.remove('visible');
    });

    console.log('📚 Приложение "Словарные слова" загружено!');
    console.log('🔊 Словарь ударений:', stressMap);
</script>

</body>
