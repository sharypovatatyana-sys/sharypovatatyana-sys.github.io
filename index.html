<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch-тест · 27 вопросов</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.6s ease;
      background: #eef3f9;
    }
    body.bg-correct { background: #d4edda; }
    body.bg-wrong { background: #f8d7da; }
    body.bg-neutral { background: #eef3f9; }

    .card {
      max-width: 880px;
      width: 100%;
      background: white;
      border-radius: 40px;
      padding: 32px 34px;
      box-shadow: 0 16px 40px rgba(0, 20, 50, 0.12);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title { font-size: 1.8rem; font-weight: 650; color: #14273e; }
    .progress {
      background: #e2ebf6;
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: 600;
      color: #1d3e62;
      font-size: 1rem;
    }

    .nav-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      padding: 12px 14px;
      background: #f5f8fe;
      border-radius: 20px;
      border: 1px solid #dce6f2;
      align-items: center;
      max-height: 120px;
      overflow-y: auto;
    }
    .nav-panel .label {
      font-weight: 600;
      color: #1d3e62;
      font-size: 0.9rem;
      margin-right: 8px;
    }
    .nav-btn {
      min-width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #d0ddea;
      background: white;
      color: #1d3e62;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
    }
    .nav-btn:hover:not(.active) {
      background: #e6f0fe;
      border-color: #7aa3e0;
    }
    .nav-btn.active {
      background: #1f6fd9;
      border-color: #1f6fd9;
      color: white;
    }
    .nav-btn.answered-correct {
      background: #b7e0c7;
      border-color: #1e8b4c;
      color: #0d5530;
    }
    .nav-btn.answered-wrong {
      background: #fad1cd;
      border-color: #c94a4a;
      color: #8f2d2d;
    }
    .nav-btn.current {
      box-shadow: 0 0 0 3px #f5a623;
    }

    .question-box { margin: 16px 0 12px; }
    .q-text { font-size: 1.3rem; font-weight: 500; color: #0a1f30; line-height: 1.4; padding: 8px 0 12px; }

    .q-image { display: none; }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0 16px;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f7faff;
      padding: 10px 18px;
      border-radius: 60px;
      border: 1.5px solid #d8e2f0;
      cursor: pointer;
      transition: 0.15s;
      font-size: 1rem;
    }
    .option:hover:not(.disabled-opt) { background: #e6f0fe; border-color: #7aa3e0; }
    .option input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #1f6fd9;
      flex-shrink: 0;
      cursor: pointer;
    }
    .option label {
      flex: 1;
      cursor: pointer;
      padding: 2px 0;
      color: #1a3047;
      font-weight: 450;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .option.correct-opt { background: #dbf0e2; border-color: #1e8b4c; }
    .option.wrong-opt { background: #fde9e7; border-color: #c94a4a; }
    .option.disabled-opt { opacity: 0.8; cursor: default; }
    .option.disabled-opt input[type="radio"] { cursor: default; }

    .practice-box {
      background: #f0f6fe;
      border-radius: 16px;
      padding: 16px 20px;
      margin: 18px 0 14px;
      border-left: 5px solid #f5a623;
    }
    .practice-box .label {
      font-weight: 700;
      color: #b57c1a;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .practice-box .task {
      margin-top: 4px;
      font-size: 1rem;
      color: #1a3047;
      line-height: 1.5;
    }
    .practice-box .task code {
      background: #e4ecf7;
      padding: 2px 10px;
      border-radius: 12px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
      color: #0f3b6b;
    }

    .explain-box {
      margin: 18px 0 14px;
      padding: 14px 20px;
      background: #f1f7fe;
      border-radius: 20px;
      border-left: 6px solid #2b6fd4;
      font-size: 0.98rem;
      color: #0c2945;
      display: none;
      line-height: 1.5;
    }
    .explain-box.show { display: block; }

    .result-badge {
      display: inline-block;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 40px;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .result-badge.correct { background: #b7e0c7; color: #0d5530; }
    .result-badge.wrong { background: #fad1cd; color: #8f2d2d; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      border-top: 1px solid #e2eaf3;
      padding-top: 22px;
    }
    .btn {
      background: #1f6fd9;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 12px 28px;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 8px rgba(0, 50, 120, 0.12);
      border: 1px solid #3178d6;
    }
    .btn:hover:not(:disabled) { background: #1355b3; transform: scale(1.02); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn.secondary {
      background: #e7eef8;
      color: #1a3857;
      border-color: #c9d6e8;
      box-shadow: none;
    }
    .btn.secondary:hover:not(:disabled) { background: #d3def0; }

    .btn.reset {
      background: #b0bccf;
      border-color: #9aa8bd;
      color: #2a3f5a;
      box-shadow: none;
    }
    .btn.reset:hover:not(:disabled) { background: #9aa8bd; }

    .stats {
      display: flex;
      gap: 24px;
      align-items: center;
      font-weight: 500;
      color: #1f3d60;
    }
    .stats span {
      background: #e9f0fa;
      padding: 4px 14px;
      border-radius: 40px;
    }
    .stats .correct-count { color: #147a3e; }
    .stats .wrong-count { color: #b13e3e; }

    .footer-note {
      font-size: 0.85rem;
      color: #607a9b;
      text-align: center;
      margin-top: 16px;
      border-top: 1px dashed #d3deee;
      padding-top: 14px;
    }
    @media (max-width: 600px) {
      .card { padding: 20px 16px; }
      .q-text { font-size: 1.1rem; }
      .actions { flex-direction: column; align-items: stretch; }
      .btn { text-align: center; }
      .stats { justify-content: center; flex-wrap: wrap; }
      .nav-panel { gap: 4px; padding: 8px 10px; }
      .nav-btn { min-width: 30px; height: 30px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <div class="header">
    <span class="title">🧩 Scratch-тест</span>
    <span class="progress" id="progressDisplay">1 / 27</span>
  </div>

  <div class="nav-panel" id="navPanel">
    <span class="label">📋 Вопросы:</span>
  </div>

  <div class="question-box">
    <div class="q-text" id="questionText">Загрузка...</div>
    <div class="q-image" id="questionImage"></div>
    <div class="options" id="optionsContainer"></div>
    <div id="practiceBox" class="practice-box"></div>
  </div>

  <div id="resultArea">
    <div id="resultBadge" class="result-badge" style="display:none;"></div>
    <div id="explainBox" class="explain-box"></div>
  </div>

  <div class="actions">
    <div class="stats">
      <span>✅ <span id="correctStat" class="correct-count">0</span></span>
      <span>❌ <span id="wrongStat" class="wrong-count">0</span></span>
      <span>📊 <span id="totalStat">0</span>/27</span>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <button class="btn reset" id="resetBtn">🔄 Начать заново</button>
      <button class="btn" id="nextBtn" disabled>➡ Следующий вопрос</button>
    </div>
  </div>
  <div class="footer-note">
    📌 Сначала выберите ответ, затем выполните практическое задание в Scratch.
  </div>
</div>

<script>
  (function() {
    // ============================================================
    // 27 ВОПРОСОВ (новые добавлены, старые отредактированы)
    // ============================================================
    const questions = [
      // ---- Вопрос 1: Что такое сообщения ----
      {
        id: 1,
        text: 'Что такое «сообщения» в Scratch?',
        options: [
          'Это способ передать сигнал между спрайтами, чтобы они реагировали на события.',
          'Это блоки для изменения громкости звука.',
          'Это блоки для рисования линий.',
          'Это способ создать новую переменную.'
        ],
        correct: 0,
        explanations: [
          '✅ Сообщения — это сигналы, которые один спрайт отправляет другому. Это основа для взаимодействия персонажей.',
          'Нет, громкость — это звуковые блоки, не сообщения.',
          'Нет, рисование — это блоки пера, не сообщения.',
          'Нет, переменные хранят данные, а не передают сигналы.'
        ],
        practice: '🧪 Создайте два спрайта. В первом напишите: "Когда зелёный флаг нажат" → "Передать сообщение СТАРТ". Во втором: "Когда я получу сообщение СТАРТ" → "Сказать Привет!". Запустите — второй спрайт заговорит только после сигнала.',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 2: Зачем нужны сообщения ----
      {
        id: 2,
        text: 'Зачем нужны сообщения в играх?',
        options: [
          'Чтобы спрайты могли общаться друг с другом и запускать события в нужный момент.',
          'Чтобы менять цвет фона.',
          'Чтобы увеличивать скорость спрайта.',
          'Чтобы сохранять игру.'
        ],
        correct: 0,
        explanations: [
          '✅ Сообщения нужны для синхронизации действий спрайтов: один говорит «старт», другой начинает двигаться.',
          'Нет, цвет фона меняется другими блоками.',
          'Нет, скорость меняется блоками движения.',
          'Нет, сохранение — это не про сообщения.'
        ],
        practice: '🧪 Создайте двух спрайтов: "Кот" и "Мяч". Кот говорит "Бросаю!" и передаёт сообщение "ЛЕТИ". Мяч получает сообщение и начинает двигаться в случайном направлении.',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 3: Линейный алгоритм ----
      {
        id: 3,
        text: 'Что такое линейный алгоритм?',
        options: [
          'Алгоритм, который повторяется много раз.',
          'Алгоритм, где команды выполняются строго друг за другом, одна после другой.',
          'Алгоритм, который выполняется только при нажатии на зеленый флаг.',
          'Алгоритм, в котором есть выбор (Если... то...).'
        ],
        correct: 1,
        explanations: [
          'Повторение — это цикл, а не линейный алгоритм.',
          '✅ Верно! Линейный алгоритм — это последовательность команд без ветвлений и пропусков.',
          'Зелёный флаг — это событие запуска, а не вид алгоритма.',
          'Выбор (If) — это ветвление, а не линейная структура.'
        ],
        practice: '🧪 Соберите скрипт из 3 блоков: "Когда зелёный флаг нажат" → "Идти 50 шагов" → "Сказать Привет". Запустите. Это пример линейного алгоритма. Попробуйте поменять порядок блоков — что изменилось?',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 4: Бесконечный цикл ----
      {
        id: 4,
        text: 'Какая команда используется для бесконечного цикла в Scratch?',
        options: [
          'Повторить 10 раз',
          'Всегда',
          'Повторять пока не',
          'Если'
        ],
        correct: 1,
        explanations: [
          'Повторить 10 — конечный цикл.',
          '✅ Верно! Блок «Всегда» создаёт бесконечный цикл.',
          '«Повторять пока не» — цикл с условием, может завершиться.',
          '«Если» — это ветвление, а не цикл.'
        ],
        practice: '🧪 Соберите скрипт: "Когда зелёный флаг нажат" → "Всегда" → внутри "Идти 10 шагов" и "Если касается края, оттолкнуться". Запустите — спрайт будет двигаться бесконечно. Теперь замените "Всегда" на "Повторить 5 раз" — что изменилось?',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 5: Поворот в цикле ----
      {
        id: 5,
        text: 'Что произойдёт, если спрайт получит команду «Повернуть на 15 градусов» внутри цикла «Повторить 10 раз»?',
        options: [
          'Повернется на 15° и остановится.',
          'Повернется на 150° (15×10).',
          'Будет прыгать.',
          'Исчезнет.'
        ],
        correct: 1,
        explanations: [
          'Цикл выполнит команду 10 раз, поэтому поворот будет многократным.',
          '✅ Каждый раз прибавляется 15°, итого 150°.',
          'Поворот не связан с прыжками.',
          'Исчезновение — другая команда.'
        ],
        practice: '🧪 Соберите скрипт: "Когда зелёный флаг нажат" → "Повторить 10 раз" → внутри "Повернуть на 15 градусов" и "Идти 5 шагов". Запустите и посмотрите, по какой траектории движется спрайт. Попробуйте изменить 15 на 36 градусов (10×36=360 — полный круг).',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 6: Координата X ----
      {
        id: 6,
        text: 'Что такое координата X в Scratch?',
        options: [
          'Движение вверх-вниз.',
          'Движение влево-вправо.',
          'Поворот спрайта.',
          'Цвет костюма.'
        ],
        correct: 1,
        explanations: [
          'Y отвечает за вверх-вниз, а X — за горизонталь.',
          '✅ Координата X определяет положение по горизонтали (влево-вправо).',
          'Поворот — это угол, а не координата.',
          'Цвет не связан с координатами.'
        ],
        practice: '🧪 Соберите 3 скрипта и проверьте, в каком направлении двигается спрайт:\n1️⃣ Скрипт с блоком "Изменить x на 50" — запишите, в какую сторону двигается спрайт? (влево или вправо)\n2️⃣ Скрипт с блоком "Изменить x на -50" — запишите, в какую сторону двигается спрайт? (влево или вправо)\n3️⃣ Скрипт с блоком "Изменить y на 50" — запишите, в какую сторону двигается спрайт? (вверх или вниз)\n\nПосле выполнения сделайте самостоятельный вывод.',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 7: Следование за мышкой ----
      {
        id: 7,
        text: 'Какой блок позволяет спрайту следовать за мышкой?',
        options: [
          'Перейти в x: 0 y: 0',
          'Повернуть в направлении 90',
          'Перейти к (указатель мыши)',
          'Сказать "Привет"'
        ],
        correct: 2,
        explanations: [
          'Это перемещает в центр, а не за мышкой.',
          'Поворот не перемещает спрайт.',
          '✅ «Перейти к указателю мыши» — идеально для слежения.',
          'Это речь, а не движение.'
        ],
        practice: '🧪 Соберите скрипт: "Когда зелёный флаг нажат" → "Всегда" → внутри "Перейти к (указатель мыши)". Запустите и двигайте мышкой — спрайт будет следовать за ней.',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 8: Повторить vs Всегда ----
      {
        id: 8,
        text: 'В чем разница между «Повторить 10 раз» и «Всегда»?',
        options: [
          '«Повторить 10» работает быстрее.',
          '«Повторить 10» выполняется конечное число раз и останавливается, а «Всегда» крутится бесконечно.',
          '«Всегда» выполняется только один раз.',
          '«Повторить 10» нельзя остановить, а «Всегда» можно.'
        ],
        correct: 1,
        explanations: [
          'Скорость не является различием.',
          '✅ Ключевое отличие: конечный повтор против бесконечного цикла.',
          'Нет, «Всегда» — бесконечный цикл.',
          'Оба можно остановить кнопкой стоп, но «Повторить 10» завершается сам.'
        ],
        practice: '🧪 Соберите два скрипта и сравните, какой остановится сам, а какой нужно останавливать вручную.',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 9: Цикл с условием ----

        id: 9,
        text: 'Какой цикл нужно использовать, чтобы спрайт двигался постоянно, но останавливался, когда коснётся другого спрайта?',
        options: [
          'Повторить 10 раз.',
          'Всегда.',
          'Повторять пока не (цикл с условием).',
          'Никакой, это делается командой «Если».'
        ],
        correct: 2,
        explanations: [
          '"Повторить 10" — конечный цикл, не подходит.',
          '"Всегда" — бесконечный цикл, не проверяет условие.',
          '✅ Цикл «повторять пока не» идеально подходит для остановки по условию.',
          '«Если» проверяет условие один раз, а не циклично.'
        ],
        practice: '🧪 Создайте двух спрайтов. Первый идёт ко второму. Используйте "Повторять пока не (касается Спрайта 2)". Когда коснётся — остановится сам.',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 10: Всегда без остановки ----
      {
        id: 10,
        text: 'Что будет, если вставить «Всегда» без команды остановки внутри?',
        options: [
          'Скрипт выполнится ровно 100 раз.',
          'Бесконечное выполнение до нажатия красной кнопки стоп.',
          'Выполнится только один раз.',
          'Спрайт изменит цвет.'
        ],
        correct: 1,
        explanations: [
          'Нет, «Всегда» не имеет лимита.',
          '✅ Бесконечный цикл будет крутиться вечно до принудительной остановки.',
          'Нет, он повторяется бесконечно.',
          'Цвет не меняется сам по себе.'
        ],
        practice: '🧪 Соберите скрипт "Всегда" → "Идти 10 шагов". Запустите и нажмите красную кнопку стоп. Добавьте внутри условие остановки — и цикл завершится сам.',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 11: If-else ----
      {
        id: 11,
        text: 'Какая конструкция используется для выбора действия в зависимости от условия?',
        options: [
          'Цикл «Повторить».',
          'Блок «Ожидать».',
          'Конструкция «Если ... то ... иначе».',
          'Блок «Создать переменную».'
        ],
        correct: 2,
        explanations: [
          'Цикл отвечает за повторение, а не за выбор.',

        practice: '🧪 Соберите скрипт: "Всегда" → "Идти 10 шагов" → "Если касается края, оттолкнуться". Запустите — спрайт будет бесконечно ходить от края до края. Попробуйте убрать «оттолкнуться» — спрайт уйдёт за край.',
        qImage: null,
        optMedia: [null, null, null, null]
      },
      // ---- Вопрос 27: Что такое тестирование ----
      {
        id: 27,
        text: 'Этап «Тестирование игр» — это когда...',
        options: [
          'Игру удаляют.',
          'Запускают и ищут ошибки (баги).',
          'Рисуют новые костюмы.',
          'Пишут название игры.'
        ],
        correct: 1,
        explanations: [
          'Удаление — не тестирование.',
          '✅ Тестирование — поиск ошибок и проверка соответствия замыслу.',
          'Рисование — это дизайн, не тестирование.',
          'Название — это не тестирование.'
        ],
        practice: '🧪 Возьмите свою игру и найдите друга, который поиграет в неё. Наблюдайте, где игра "ломается" или ведёт себя не так, как задумано. Запишите все найденные баги — это и есть тестирование!',
        qImage: null,
        optMedia: [null, null, null, null]
      }
    ];

    // ----- СОСТОЯНИЕ -----
    let currentIndex = 0;
    let answers = new Array(questions.length).fill(null);
    let answered = new Array(questions.length).fill(false);
    let correctCount = 0;
    let wrongCount = 0;

    const bodyEl = document.body;
    const questionText = document.getElementById('questionText');
    const practiceBox = document.getElementById('practiceBox');
    const questionImage = document.getElementById('questionImage');
    const optionsContainer = document.getElementById('optionsContainer');
    const resultBadge = document.getElementById('resultBadge');
    const explainBox = document.getElementById('explainBox');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const progressDisplay = document.getElementById('progressDisplay');
    const correctStat = document.getElementById('correctStat');
    const wrongStat = document.getElementById('wrongStat');
    const totalStat = document.getElementById('totalStat');
    const navPanel = document.getElementById('navPanel');

    function setBackground(state) {
      bodyEl.classList.remove('bg-correct', 'bg-wrong', 'bg-neutral');
      if (state === 'correct') bodyEl.classList.add('bg-correct');
      else if (state === 'wrong') bodyEl.classList.add('bg-wrong');
      else bodyEl.classList.add('bg-neutral');
    }
    setBackground('neutral');

    function updateStats() {
      correctStat.textContent = correctCount;
      wrongStat.textContent = wrongCount;
      totalStat.textContent = correctCount + wrongCount;
    }

    function renderNav() {
      let html = '<span class="label">📋 Вопросы:</span>';
      for (let i = 0; i < questions.length; i++) {
        let btnClass = 'nav-btn';
        if (i === currentIndex) btnClass += ' current';
        if (answered[i]) {
          if (answers[i] === questions[i].correct) btnClass += ' answered-correct';
          else btnClass += ' answered-wrong';
        }
        html += `<button class="${btnClass}" data-index="${i}">${i + 1}</button>`;
      }
      navPanel.innerHTML = html;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.index);
          if (!isNaN(idx)) {
            currentIndex = idx;
            renderQuestion(currentIndex);
          }
        });
      });
    }

    function renderQuestion(index) {
      const q = questions[index];
      questionText.textContent = q.text;

      questionImage.innerHTML = '';
      questionImage.style.display = 'none';

      const selectedIdx = answers[index];
      const isAnswered = answered[index];
      let html = '';

      for (let i = 0; i < q.options.length; i++) {
        let optClass = 'option';
        let checked = (selectedIdx === i) ? 'checked' : '';

        if (isAnswered) {
          optClass += ' disabled-opt';
          if (i === q.correct) optClass += ' correct-opt';
          else if (i === selectedIdx && selectedIdx !== q.correct) optClass += ' wrong-opt';
        }

        html += `
          <div class="${optClass}" data-q="${index}" data-opt="${i}">
            <input type="radio" name="q${index}" value="${i}" id="q${index}_opt${i}" ${checked} ${isAnswered ? 'disabled' : ''}>
            <label for="q${index}_opt${i}">
              ${String.fromCharCode(65 + i)}. ${q.options[i]}
            </label>
          </div>
        `;
      }
      optionsContainer.innerHTML = html;

      if (q.practice) {
        practiceBox.innerHTML = `
          <div class="label">🧪 Практическое задание</div>
          <div class="task">${q.practice.replace(/\n/g, '<br>')}</div>
        `;
        practiceBox.style.display = 'block';
      } else {
        practiceBox.style.display = 'none';
      }

      if (isAnswered) {
        const isCorrect = (selectedIdx === q.correct);
        resultBadge.style.display = 'inline-block';
        resultBadge.className = `result-badge ${isCorrect ? 'correct' : 'wrong'}`;
        resultBadge.textContent = isCorrect ? '✅ Верно!' : '❌ Неверно';

        setBackground(isCorrect ? 'correct' : 'wrong');

        let explanationText = '';
        if (!isCorrect && selectedIdx !== null) {
          explanationText = q.explanations[selectedIdx] || 'Пояснение не задано.';
        } else if (isCorrect) {
          explanationText = q.explanations[q.correct] || '';
        }
        explainBox.className = 'explain-box show';
        explainBox.textContent = explanationText;
      } else {
        resultBadge.style.display = 'none';
        explainBox.className = 'explain-box';
        explainBox.textContent = '';
        setBackground('neutral');
      }

      progressDisplay.textContent = `${index + 1} / ${questions.length}`;
      updateStats();

      if (index === questions.length - 1) {
        nextBtn.textContent = '🏁 Завершено';
        nextBtn.disabled = !isAnswered;
      } else {
        nextBtn.textContent = '➡ Следующий вопрос';
        nextBtn.disabled = !isAnswered;
      }

      renderNav();
    }

    function handleOptionSelect(qIndex, optIndex) {
      if (answered[qIndex]) return;
      answers[qIndex] = optIndex;
      answered[qIndex] = true;
      const q = questions[qIndex];
      if (optIndex === q.correct) correctCount++;
      else wrongCount++;
      renderQuestion(qIndex);
    }

    function goToNext() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        if (answered.every(v => v === true)) {
          alert(`🎉 Тест завершён! Правильных: ${correctCount}, Неправильных: ${wrongCount}`);
        } else {
          alert('Ответьте на текущий вопрос, чтобы завершить.');
        }
      }
    }

    function resetAll() {
      currentIndex = 0;
      answers = new Array(questions.length).fill(null);
      answered = new Array(questions.length).fill(false);
      correctCount = 0;
      wrongCount = 0;
      renderQuestion(0);
    }

    optionsContainer.addEventListener('click', function(e) {
      const target = e.target.closest('.option');
      if (!target) return;
      if (target.classList.contains('disabled-opt')) return;
      const qIndex = parseInt(target.dataset.q);
      const optIndex = parseInt(target.dataset.opt);
      if (isNaN(qIndex) || isNaN(optIndex)) return;
      const radio = target.querySelector('input[type="radio"]');
      if (radio && !radio.disabled) {
        radio.checked = true;
        handleOptionSelect(qIndex, optIndex);
      }
    });

    nextBtn.addEventListener('click', goToNext);
    resetBtn.addEventListener('click', resetAll);

    renderNav();
    renderQuestion(0);
  })();
</script>
</body>
</html>
