<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Координатная плоскость — шаг за шагом</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #f6f9fc 0%, #e6f0f5 100%);
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0, 20, 30, 0.2), 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 24px 24px 30px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid #c0dceb;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 2.2rem;
            font-weight: 500;
            color: #1b4f6e;
            text-shadow: 2px 2px 0 #c0e0f0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            font-size: 2.6rem;
            line-height: 1;
        }

        canvas {
            display: block;
            width: 700px;
            height: 500px;
            border-radius: 36px;
            box-shadow: inset 0 0 0 2px #aac9db, 0 8px 18px rgba(0, 0, 0, 0.1);
            background: #fefefe;
            cursor: crosshair;
            transition: box-shadow 0.1s;
            touch-action: none;
        }

        canvas:active {
            box-shadow: inset 0 0 0 3px #7faec9, 0 8px 18px rgba(0, 0, 0, 0.1);
        }

        .info-panel {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 24px;
            background: #e1eff7;
            padding: 12px 30px;
            border-radius: 60px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.05), 0 4px 8px rgba(0, 0, 0, 0.05);
            font-size: 1.6rem;
            color: #1b4f6e;
            flex-wrap: wrap;
            justify-content: center;
        }

        .coord-badge {
            background: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            box-shadow: 0 4px 0 #b0c9d9;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 260px;
            justify-content: center;
        }

        .coord-badge .label {
            font-size: 1.2rem;
            color: #427a99;
            margin-right: 2px;
        }

        .coord-badge span.val {
            font-size: 1.9rem;
            font-weight: 700;
            color: #0e3a4f;
            background: #ffefc0;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 1.4;
            min-width: 2.4rem;
            text-align: center;
            transition: background 0.2s;
        }

        .coord-badge span.val.active {
            background: #ffd166;
            box-shadow: 0 0 0 3px #ffb703 inset;
        }

        .reset-btn {
            background: #ffffff;
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1b4f6e;
            box-shadow: 0 6px 0 #aac1d0, 0 6px 12px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: 0.08s linear;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            border: 1px solid #c0dceb;
        }

        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #aac1d0, 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .reset-btn:hover {
            background: #f0faff;
        }

        .step-indicator {
            font-size: 1.2rem;
            color: #427a99;
            background: #ffffff;
            padding: 6px 16px;
            border-radius: 30px;
            box-shadow: 0 3px 0 #b0c9d9;
            min-width: 180px;
            text-align: center;
        }

        @media (max-width: 760px) {
            .container { padding: 16px; }
            h1 { font-size: 1.6rem; }
            .info-panel { font-size: 1.2rem; padding: 10px 16px; gap: 12px; }
            .coord-badge { min-width: 200px; padding: 6px 14px; }
            .coord-badge span.val { font-size: 1.5rem; min-width: 1.8rem; }
            .coord-badge .label { font-size: 1rem; }
            .reset-btn { font-size: 1.1rem; padding: 8px 16px; }
            .step-indicator { font-size: 1rem; min-width: 140px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        <span>🧸</span> Координаты <span>⭐</span>
    </h1>

    <canvas id="gridCanvas" width="700" height="500"></canvas>

    <div class="info-panel">
        <div class="coord-badge">
            📍 (
            <span class="label">X</span>
            <span class="val" id="coordX">?</span>
            ,
            <span class="label">Y</span>
            <span class="val" id="coordY">?</span>
            )
        </div>
        <div class="step-indicator" id="stepIndicator">Нажми на клетку</div>
        <button class="reset-btn" id="resetButton">
            <span>🧹</span> Очистить
        </button>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        const coordXSpan = document.getElementById('coordX');
        const coordYSpan = document.getElementById('coordY');
        const resetBtn = document.getElementById('resetButton');
        const stepIndicator = document.getElementById('stepIndicator');

        const W = 700;
        const H = 500;

        const originX = Math.floor(W / 2);
        const originY = Math.floor(H / 2);
        const step = 40;

        const maxX = Math.floor(Math.min(originX - 20, W - originX - 20) / step);
        const maxY = Math.floor(Math.min(originY - 20, H - originY - 20) / step);

        let activePoint = null;
        let activeCoord = null;
        let phase = 'idle'; // 'idle' | 'yShown' | 'bothShown'

        function toCoord(px, py) {
            return {
                x: Math.round((px - originX) / step),
                y: Math.round((originY - py) / step)
            };
        }

        function toPixel(cx, cy) {
            return {
                x: originX + cx * step,
                y: originY - cy * step
            };
        }

        function updateBadge() {
            if (phase === 'idle') {
                coordXSpan.textContent = '?';
                coordYSpan.textContent = '?';
                coordXSpan.classList.remove('active');
                coordYSpan.classList.remove('active');
            } else if (phase === 'yShown') {
                coordXSpan.textContent = '?';
                coordYSpan.textContent = activeCoord.y;
                coordXSpan.classList.remove('active');
                coordYSpan.classList.add('active');
            } else if (phase === 'bothShown') {
                coordXSpan.textContent = activeCoord.x;
                coordYSpan.textContent = activeCoord.y;
                coordXSpan.classList.add('active');
                coordYSpan.classList.add('active');
            }
        }

        function updateStepText() {
            if (phase === 'idle') {
                stepIndicator.textContent = '👆 Нажми на клетку';
            } else if (phase === 'yShown') {
                stepIndicator.textContent = '⬇️ Y = ' + activeCoord.y + ' → нажми ещё раз';
            } else {
                stepIndicator.textContent = '✅ Точка (' + activeCoord.x + ', ' + activeCoord.y + ')';
            }
        }

        // Проверка: попадает ли прямоугольник в запретную зону (пунктирная линия)
        // Прямоугольник задаётся центром (cx, cy), шириной w, высотой h
        function intersectsLine(cx, cy, w, h, x1, y1, x2, y2, padding) {
            const left = cx - w / 2 - padding;
            const right = cx + w / 2 + padding;
            const top = cy - h / 2 - padding;
            const bottom = cy + h / 2 + padding;

            // Прямоугольник, описывающий линию (с учётом padding)
            const lLeft = Math.min(x1, x2) - padding;
            const lRight = Math.max(x1, x2) + padding;
            const lTop = Math.min(y1, y2) - padding;
            const lBottom = Math.max(y1, y2) + padding;

            return !(right < lLeft || left > lRight || bottom < lTop || top > lBottom);
        }

        // Поиск свободного места для подписи
        // axis: 'y' или 'x'
        // Возвращает { x, y, align, baseline } — координаты и настройки текста
        function findFreeSpotForLabel(axis, value, labelText, dotPx, dotPy) {
            const textWidth = ctx.measureText(labelText).width;
            const textHeight = 22; // приблизительная высота шрифта 18px
            const padding = 14;

            // Точка на оси, где стоит засечка
            let axisPointX, axisPointY;
            if (axis === 'y') {
                axisPointX = originX;
                axisPointY = originY - value * step;
            } else {
                axisPointX = originX + value * step;
                axisPointY = originY;
            }

            // Пунктирные линии (для проверки пересечения)
            // Для Y: горизонтальная линия от точки до оси Y: y = dotPy, x от originX до dotPx
            // Для X: вертикальная линия от точки до оси X: x = dotPx, y от dotPy до originY
            let line1 = null; // линия, которую строим на текущем шаге
            if (axis === 'y') {
                line1 = { x1: originX, y1: dotPy, x2: dotPx, y2: dotPy };
            } else {
                line1 = { x1: dotPx, y1: dotPy, x2: dotPx, y2: originY };
            }

            // Вторая линия (если уже нарисована) — для оси X это линия Y
            let line2 = null;
            if (axis === 'x' && phase === 'bothShown') {
                line2 = { x1: originX, y1: dotPy, x2: dotPx, y2: dotPy };
            }

            // Запретная зона вокруг цифр на осях
            // Цифры на оси X: y = originY + 22, x = originX + i*step (для всех i)
            // Цифры на оси Y: x = originX - 24, y = originY - i*step (для всех i)

            // Кандидаты для Y (вокруг засечки на оси Y)
            if (axis === 'y') {
                // Варианты: справа от оси, слева от оси, выше, ниже
                const candidates = [
                    // справа от оси, выровнено по центру засечки
                    { x: originX + 16, y: axisPointY, align: 'left', baseline: 'middle' },
                    // слева от оси (но там цифры, оставляем на крайний случай)
                    { x: originX - 16 - textWidth, y: axisPointY, align: 'left', baseline: 'middle' },
                    // выше засечки справа
                    { x: originX + 16, y: axisPointY - 22, align: 'left', baseline: 'middle' },
                    // ниже засечки справа
                    { x: originX + 16, y: axisPointY + 22, align: 'left', baseline: 'middle' },
                    // выше засечки слева
                    { x: originX - 16 - textWidth, y: axisPointY - 22, align: 'left', baseline: 'middle' },
                    // ниже засечки слева
                    { x: originX - 16 - textWidth, y: axisPointY + 22, align: 'left', baseline: 'middle' },
                ];

                for (const cand of candidates) {
                    // Проверяем границы холста
                    if (cand.x < 6 || cand.x + textWidth > W - 6) continue;
                    if (cand.y - textHeight / 2 < 6 || cand.y + textHeight / 2 > H - 6) continue;

                    // Проверяем, не пересекается ли с цифрами на оси Y (x ≈ originX-24)
                    // Цифры занимают область примерно от originX-30 до originX-16 по x
                    // Наша подпись не должна попадать в эту полосу, если она на той же высоте
                    const labelLeft = cand.x;
                    const labelRight = cand.x + textWidth;
                    const labelTop = cand.y - textHeight / 2;
                    const labelBottom = cand.y + textHeight / 2;

                    // Проверка на пересечение с зоной цифр оси Y
                    const digitsYLeft = originX - 34;
                    const digitsYRight = originX - 10;
                    if (!(labelRight < digitsYLeft || labelLeft > digitsYRight)) {
                        // Подпись пересекается по X с цифрами — проверим по Y
                        // Цифры на оси Y находятся на высотах originY - i*step (для всех i)
                        let overlapsDigits = false;
                        for (let i = -maxY; i <= maxY; i++) {
                            const digitY = originY - i * step;
                            if (Math.abs(cand.y - digitY) < textHeight / 2 + 8) {
                                overlapsDigits = true;
                                break;
                            }
                        }
                        if (overlapsDigits) continue;
                    }

                    // Проверка на пересечение с пунктирной линией
                    if (line1 && intersectsLine(cand.x + textWidth / 2, cand.y, textWidth, textHeight,
                        line1.x1, line1.y1, line1.x2, line1.y2, padding)) {
                        continue;
                    }
                    if (line2 && intersectsLine(cand.x + textWidth / 2, cand.y, textWidth, textHeight,
                        line2.x1, line2.y1, line2.x2, line2.y2, padding)) {
                        continue;
                    }

                    // Проверка, что не накладывается на саму точку
                    if (Math.abs(cand.x + textWidth / 2 - dotPx) < textWidth / 2 + 16 &&
                        Math.abs(cand.y - dotPy) < textHeight / 2 + 16) {
                        continue;
                    }

                    return cand;
                }
            }

            // Кандидаты для X (вокруг засечки на оси X)
            if (axis === 'x') {
                const candidates = [
                    // над осью, по центру засечки
                    { x: axisPointX, y: originY - 16, align: 'center', baseline: 'bottom' },
                    // под осью (там цифры, но если выше не влезло — пробуем)
                    { x: axisPointX, y: originY + 16, align: 'center', baseline: 'top' },
                    // над осью, чуть левее
                    { x: axisPointX - textWidth / 2 - 10, y: originY - 16, align: 'left', baseline: 'bottom' },
                    // над осью, чуть правее
                    { x: axisPointX + textWidth / 2 + 10, y: originY - 16, align: 'right', baseline: 'bottom' },
                    // выше и левее
                    { x: axisPointX, y: originY - 38, align: 'center', baseline: 'bottom' },
                    // выше и правее
                    { x: axisPointX, y: originY - 38, align: 'center', baseline: 'bottom' },
                ];

                for (const cand of candidates) {
                    // Вычисляем bounding box в зависимости от выравнивания
                    let left, right;
                    if (cand.align === 'center') {
                        left = cand.x - textWidth / 2;
                        right = cand.x + textWidth / 2;
                    } else if (cand.align === 'left') {
                        left = cand.x;
                        right = cand.x + textWidth;
                    } else {
                        left = cand.x - textWidth;
                        right = cand.x;
                    }

                    let top, bottom;
                    if (cand.baseline === 'bottom') {
                        top = cand.y - textHeight;
                        bottom = cand.y;
                    } else {
                        top = cand.y;
                        bottom = cand.y + textHeight;
                    }

                    // Границы холста
                    if (left < 6 || right > W - 6) continue;
                    if (top < 6 || bottom > H - 6) continue;

                    // Проверка на пересечение с цифрами оси X (y ≈ originY + 22)
                    const digitsXTop = originY + 12;
                    const digitsXBottom = originY + 32;
                    if (!(bottom < digitsXTop || top > digitsXBottom)) {
                        // Пересекается по Y с цифрами — проверим по X
                        let overlapsDigits = false;
                        for (let i = -maxX; i <= maxX; i++) {
                            const digitX = originX + i * step;
                            if (Math.abs(cand.x - digitX) < textWidth / 2 + 12) {
                                overlapsDigits = true;
                                break;
                            }
                        }
                        if (overlapsDigits) continue;
                    }

                    // Проверка на пересечение с пунктирными линиями
                    if (line1 && intersectsLine((left + right) / 2, (top + bottom) / 2,
                        right - left, bottom - top,
                        line1.x1, line1.y1, line1.x2, line1.y2, padding)) {
                        continue;
                    }
                    if (line2 && intersectsLine((left + right) / 2, (top + bottom) / 2,
                        right - left, bottom - top,
                        line2.x1, line2.y1, line2.x2, line2.y2, padding)) {
                        continue;
                    }

                    // Проверка, что не накладывается на саму точку
                    if (Math.abs((left + right) / 2 - dotPx) < textWidth / 2 + 16 &&
                        Math.abs((top + bottom) / 2 - dotPy) < textHeight / 2 + 16) {
                        continue;
                    }

                    return cand;
                }
            }

            // Если ничего не нашли — fallback (стандартное место)
            if (axis === 'y') {
                return { x: originX + 16, y: axisPointY, align: 'left', baseline: 'middle' };
            } else {
                return { x: axisPointX, y: originY - 16, align: 'center', baseline: 'bottom' };
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, W, H);

            ctx.fillStyle = '#fefefe';
            ctx.fillRect(0, 0, W, H);

            // Сетка
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#d0e2ed';
            for (let x = originX % step; x <= W; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = originY % step; y <= H; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // Оси
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(20, originY);
            ctx.lineTo(W - 20, originY);
            ctx.strokeStyle = '#3f7e9c';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(originX, H - 20);
            ctx.lineTo(originX, 20);
            ctx.strokeStyle = '#3f7e9c';
            ctx.stroke();

            // Стрелочки
            ctx.fillStyle = '#3f7e9c';
            ctx.beginPath();
            ctx.moveTo(W - 20, originY - 8);
            ctx.lineTo(W - 10, originY);
            ctx.lineTo(W - 20, originY + 8);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(originX - 8, 20);
            ctx.lineTo(originX, 10);
            ctx.lineTo(originX + 8, 20);
            ctx.fill();

            // Подписи осей
            ctx.font = 'bold 24px "Segoe UI", "Comic Sans MS", sans-serif';
            ctx.fillStyle = '#1b4f6e';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('X', W - 40, originY - 18);
            ctx.fillText('Y', originX + 12, 35);

            // Цифры на осях
            ctx.font = 'bold 14px "Segoe UI", "Comic Sans MS", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = -maxX; i <= maxX; i++) {
                if (i === 0) continue;
                const px = originX + i * step;
                if (px < 15 || px > W - 15) continue;
                ctx.fillStyle = '#2f5f7a';
                ctx.fillText(i.toString(), px, originY + 22);
            }

            for (let i = -maxY; i <= maxY; i++) {
                if (i === 0) continue;
                const py = originY - i * step;
                if (py < 15 || py > H - 15) continue;
                ctx.fillStyle = '#2f5f7a';
                ctx.fillText(i.toString(), originX - 24, py);
            }

            // Ноль
            ctx.fillStyle = '#1b4f6e';
            ctx.font = 'bold 16px "Segoe UI", "Comic Sans MS", sans-serif';
            ctx.fillText('0', originX - 18, originY + 18);

            // --- Пунктиры, подписи и точка ---
            if (activePoint && activeCoord) {
                const px = activePoint.x;
                const py = activePoint.y;

                // Шаг 1: пунктир к оси Y (горизонтальная линия)
                if (phase === 'yShown' || phase === 'bothShown') {
                    ctx.beginPath();
                    ctx.setLineDash([7, 7]);
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = '#2a9d8f';
                    ctx.moveTo(px, py);
                    ctx.lineTo(originX, py);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Засечка на оси Y
                    const yPix = originY - activeCoord.y * step;
                    ctx.beginPath();
                    ctx.arc(originX, yPix, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#2a9d8f';
                    ctx.fill();
                }

                // Шаг 2: пунктир к оси X (вертикальная линия)
                if (phase === 'bothShown') {
                    ctx.beginPath();
                    ctx.setLineDash([7, 7]);
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = '#e07a5f';
                    ctx.moveTo(px, py);
                    ctx.lineTo(px, originY);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Засечка на оси X
                    const xPix = originX + activeCoord.x * step;
                    ctx.beginPath();
                    ctx.arc(xPix, originY, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#e07a5f';
                    ctx.fill();
                }

                // Сама точка
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.arc(px, py, 9, 0, 2 * Math.PI);
                ctx.fillStyle = '#e63946';
                ctx.shadowColor = '#f0a0a0';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // --- Подписи координат (ищем свободное место) ---
                ctx.font = 'bold 18px "Segoe UI", "Comic Sans MS", sans-serif';

                // Подпись Y
                if (phase === 'yShown' || phase === 'bothShown') {
                    const labelY = 'Y=' + activeCoord.y;
                    const posY = findFreeSpotForLabel('y', activeCoord.y, labelY, px, py);
                    ctx.fillStyle = '#2a9d8f';
                    ctx.textAlign = posY.align;
                    ctx.textBaseline = posY.baseline;
                    ctx.fillText(labelY, posY.x, posY.y);
                }

                // Подпись X
                if (phase === 'bothShown') {
                    const labelX = 'X=' + activeCoord.x;
                    const posX = findFreeSpotForLabel('x', activeCoord.x, labelX, px, py);
                    ctx.fillStyle = '#e07a5f';
                    ctx.textAlign = posX.align;
                    ctx.textBaseline = posX.baseline;
                    ctx.fillText(labelX, posX.x, posX.y);
                }
            }

            // Начало координат
            ctx.beginPath();
            ctx.arc(originX, originY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#1b4f6e';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#aac9db';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function handleCanvasClick(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let mouseX = (event.clientX - rect.left) * scaleX;
            let mouseY = (event.clientY - rect.top) * scaleY;

            if (mouseX < 0 || mouseX > W || mouseY < 0 || mouseY > H) return;

            let coord = toCoord(mouseX, mouseY);
            coord.x = Math.min(Math.max(coord.x, -maxX), maxX);
            coord.y = Math.min(Math.max(coord.y, -maxY), maxY);

            const pixelPoint = toPixel(coord.x, coord.y);
            if (pixelPoint.x < 10 || pixelPoint.x > W - 10 || pixelPoint.y < 10 || pixelPoint.y > H - 10) return;

            if (phase === 'idle') {
                activePoint = { x: pixelPoint.x, y: pixelPoint.y };
                activeCoord = coord;
                phase = 'yShown';
            } else if (phase === 'yShown') {
                phase = 'bothShown';
            } else {
                activePoint = { x: pixelPoint.x, y: pixelPoint.y };
                activeCoord = coord;
                phase = 'yShown';
            }

            updateBadge();
            updateStepText();
            drawScene();
        }

        function resetCanvas() {
            activePoint = null;
            activeCoord = null;
            phase = 'idle';
            updateBadge();
            updateStepText();
            drawScene();
        }

        function init() {
            resetCanvas();
            canvas.addEventListener('click', handleCanvasClick);
            resetBtn.addEventListener('click', resetCanvas);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const fakeEvent = {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                };
                handleCanvasClick(fakeEvent);
            }, { passive: false });
        }

        window.addEventListener('load', init);
    })();
</script>
</body>
</html>
